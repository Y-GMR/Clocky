name: Package Standalone Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET 9 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Publish Standalone Executable
      run: |
        dotnet publish src/Clocky/Clocky.csproj `
          -c Release `
          -r win-x64 `
          --self-contained true `
          -p:PublishSingleFile=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -p:EnableCompressionInSingleFile=true `
          -p:PublishReadyToRun=true `
          -o dist/
        $hash = (Get-FileHash -Path "dist/Clocky.exe" -Algorithm SHA256).Hash.ToLower()
        "$hash  Clocky.exe" | Out-File -FilePath "dist/SHA256SUMS.txt" -Encoding ascii
        $v = Get-Content "version.json" | ConvertFrom-Json
        $v | Add-Member -MemberType NoteProperty -Name "sha256" -Value $hash -Force
        $v | ConvertTo-Json -Depth 10 | Set-Content -Path "version.json" -Encoding UTF8

    - name: Commit and Sync version.json to Master
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add version.json
        git commit -m "chore(release): sync version.json checksum for release"
        git push origin HEAD:master
      continue-on-error: true

    - name: Extract Release Notes from CHANGELOG.md
      shell: pwsh
      run: |
        $tag = "${{ github.ref_name }}"
        $version = $tag.TrimStart('v')
        $content = Get-Content "CHANGELOG.md" -Raw
        $pattern = "(?s)## \[$version\] - \d{4}-\d{2}-\d{2}\r?\n\r?\n(.*?)(?=\r?\n## \[|\r?\n---|\Z)"
        if ($content -match $pattern) {
            $notes = $matches[1].Trim()
            $notes | Out-File -FilePath "release_notes.md" -Encoding utf8
        } else {
            "Release $tag" | Out-File -FilePath "release_notes.md" -Encoding utf8
        }

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        body_path: release_notes.md
        files: |
          dist/Clocky.exe
          dist/SHA256SUMS.txt
          version.json
        draft: false
        prerelease: false
